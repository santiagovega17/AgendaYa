name: Pipeline de CI

# El plan de hotfix hace pasar el cambio por main y develop.
# La rama hotfix/* también corre el pipeline antes de abrir el PR.
on:
  push:
    branches: [main, develop, "hotfix/**"]
  pull_request:
    branches: [main, develop, "hotfix/**"]
  workflow_dispatch:

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci
        env:
          # Los E2E de Cypress corren en local contra Supabase. En CI no se baja el binario.
          CYPRESS_INSTALL_BINARY: 0

      - name: Verificar formato
        run: npm run format:check

      - name: Verificar linter
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      - name: Build
        run: npm run build
